name: Build APK
on:
  push:
    tags: ["v*"]
    branches: ["**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        run: |
          mkdir -p logs
          set -o pipefail
          gradle assembleDebug --stacktrace --warning-mode all 2>&1 | tee logs/build.log
      - name: Name the APK with its version
        if: success()
        run: |
          . <(grep -E '^VERSION_' version.properties)
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk "dist/StudyTint-v${VERSION_NAME}-build${GITHUB_RUN_NUMBER}.apk"
      - name: Extract error log
        if: always()
        run: |
          grep -nE "^e: |error:|FAILED|Exception|What went wrong" -A4 logs/build.log > logs/errors.log || echo "No errors found" > logs/errors.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          retention-days: 14
          path: |
            logs/
            app/build/reports/
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudyTint-debug-apk
          path: dist/*.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish release (tags only)
        if: success() && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true
