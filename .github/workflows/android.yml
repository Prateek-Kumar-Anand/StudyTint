name: Build APK
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build debug APK
        run: |
          mkdir -p logs
          set -o pipefail
          gradle assembleDebug --stacktrace --warning-mode all 2>&1 | tee logs/build.log
      - name: Extract error log
        if: always()
        run: |
          grep -nE "^e: |error:|FAILED|Exception|What went wrong" -A4 logs/build.log > logs/errors.log || echo "No errors found" > logs/errors.log
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          retention-days: 14
          path: |
            logs/
            app/build/reports/
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: StudyTint-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30
